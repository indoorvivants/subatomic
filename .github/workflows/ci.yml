name: CI
on:
  push:
    branches: ["master"]
    tags: ["v*"]
  pull_request:
    branches: ["*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI ${{ matrix.java }} (${{matrix.scalaPlatform}})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        java: [17]
        scalaPlatform: ["jvm", "js", "native"]
        include:
          # values of sbt's `platform` setting, used in project queries
          - scalaPlatform: jvm
            sbtPlatform: jvm
          - scalaPlatform: js
            sbtPlatform: sjs1
          - scalaPlatform: native
            sbtPlatform: native0.5
    runs-on: ${{ matrix.os }}
    env:
      QUERY: '...@platform=${{ matrix.sbtPlatform }}'
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin' 
          java-version: '${{ matrix.java }}'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - name: Test
        run: sbt "$QUERY/test"

      - name: Code quality
        run: sbt "$QUERY/scalafmtCheckAll; $QUERY/scalafix --check; $QUERY/headerCheck"

      - name: SBT Plugin test
        run: sbt plugin/scripted
        if: matrix.scalaPlatform == 'jvm'

      - name: Check site build
        run: sbt 'buildSite; buildBlog'
        if: matrix.scalaPlatform == 'jvm'

  mergify-build-checkpoint:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: I only exist to please Mergify :(
        run: echo "It's a sad existence but necessary"

  release:
    name: Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/master')
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6  
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin' 
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1

      - run: git fetch --unshallow

      - name: Publish ${{ github.ref }}
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

  publish:
    runs-on: ubuntu-latest
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/master')
    steps:
      - uses: actions/checkout@v4
      - uses: coursier/cache-action@v6    
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin' 
          java-version: '17'
          cache: sbt

      - uses: sbt/setup-sbt@v1
      - run: git fetch --unshallow
      - name: Build site
        run: sbt "buildSite --destination $(pwd)/_site; buildBlog --destination $(pwd)/_site/blog"
      - name: Publish gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
